name: daily-brief
on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:
    inputs:
      send_notification:
        description: 'Send this run to WeChat (leave false for diagnostics)'
        type: boolean
        default: false

      cloud_probe:
        description: 'Public Telegram Web connectivity test only, no account access'
        type: boolean
        default: false

      telegram_web_probe:
        description: 'Two fresh cloud WebA login/download tests; no publication or notification'
        type: boolean
        default: false

      telegram_inventory:
        description: 'Inspect public channel attachment filenames only'
        type: boolean
        default: false

      telegram_only:
        description: 'Validate Telegram download/extraction only; no generation or notification'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  telegram-inventory:
    if: inputs.telegram_inventory == true
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - env:
          TELEGRAM_WEB_STATE: ${{ secrets.TELEGRAM_WEB_STATE }}
        run: python telegram_web_source.py

  telegram-web-probe:
    if: inputs.telegram_web_probe == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0 PyMuPDF==1.28.2
      - run: python -m playwright install --with-deps chromium
      - name: Restore login and verify one PDF
        env:
          TELEGRAM_WEB_STATE: ${{ secrets.TELEGRAM_WEB_STATE }}
        run: python probe_telegram_web.py

  cloud-probe:
    if: inputs.cloud_probe == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python probe_telegram_cloud.py

  build:
    if: inputs.cloud_probe != true && inputs.telegram_web_probe != true && inputs.telegram_inventory != true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: deps
        run: pip install htmldocx requests

      - name: telegram-deps
        if: vars.TELEGRAM_ENABLED == 'true'
        run: pip install -r requirements-telegram.txt

      - name: telegram-source
        id: telegram
        if: vars.TELEGRAM_ENABLED == 'true'
        continue-on-error: true
        env:
          TELEGRAM_AUTH_JSON: ${{ secrets.TELEGRAM_AUTH_JSON }}
          TELEGRAM_WORK_DIR: ${{ runner.temp }}/telegram-private
        run: python telegram_source.py

      - name: telegram-check
        if: inputs.telegram_only == true
        env:
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          TELEGRAM_OUTCOME: ${{ steps.telegram.outcome }}
        run: test "$TELEGRAM_ENABLED" = true && test "$TELEGRAM_OUTCOME" = success

      - name: collect
        if: inputs.telegram_only != true
        env:
          TZ: Asia/Shanghai
        run: |
          mkdir -p data site
          python collect.py lithub > data/lithub.txt 2>/dev/null || echo COLLECT_LITHUB_FAILED > data/lithub.txt
          python collect.py podcasts "The Daily" "Crime Junkie" "The Rest Is History" "SmartLess" "The Mel Robbins Podcast" "Stuff You Should Know" > data/podcasts.txt 2>/dev/null || echo COLLECT_PODCASTS_FAILED > data/podcasts.txt
          python collect.py wikipedia "List_of_The_New_York_Times_number-one_books_of_2026" > data/wikipedia.txt 2>/dev/null || echo COLLECT_WIKI_FAILED > data/wikipedia.txt
          python collect.py googlenews "Nobel Prize in Literature 2026 prediction OR odds OR favorite OR contender" > data/nobel_lit.txt 2>/dev/null || echo NOBEL_LIT_FAILED > data/nobel_lit.txt
          python collect.py googlenews "Nobel memorial prize in economics 2026 prediction OR favorite OR frontrunner" > data/nobel_econ.txt 2>/dev/null || echo NOBEL_ECON_FAILED > data/nobel_econ.txt
          python collect.py googlenews "literary fiction books authors prize award" > data/fallback_lit.txt 2>/dev/null || echo FALLBACK_LIT_FAILED > data/fallback_lit.txt
          python collect.py googlenews "\"economics book\" 2026" > data/fallback_econ.txt 2>/dev/null || echo FALLBACK_ECON_FAILED > data/fallback_econ.txt
          python collect.py googlenews "\"Book Deals\" Publishers Weekly" > data/rights.txt 2>/dev/null || echo RIGHTS_FAILED > data/rights.txt
          python collect.py googlenews "publishing rights deal book auction" >> data/rights.txt 2>/dev/null || true
          echo "collected:"; wc -c data/*.txt

      - name: generate
        if: inputs.telegram_only != true
        env:
          TELEGRAM_SOURCE: ${{ runner.temp }}/telegram-private/source.json
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_TOKEN: ${{ secrets.GLM_TOKEN }}
          TZ: Asia/Shanghai
        run: python gen_brief.py

      - name: docx
        if: inputs.telegram_only != true
        run: |
          D=$(date +%F)
          python make_docx.py "site/${D}.html" "site/${D}.docx" || echo "WARN: docx failed, continue"
        env:
          TZ: Asia/Shanghai

      - name: publish
        if: inputs.telegram_only != true
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add site/ data/ || true
          git commit -m "brief $(date +%F)" || echo "nothing to commit"
          git push
        env:
          TZ: Asia/Shanghai

      - name: notify
        if: inputs.telegram_only != true && (github.event_name == 'schedule' || inputs.send_notification == true)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          TZ: Asia/Shanghai
        run: python notify.py

      # 任一步骤失败也要推送告警，避免无声断更（2026-09-19教训）
      - name: notify-failure
        if: failure() && inputs.telegram_only != true && (github.event_name == 'schedule' || inputs.send_notification == true)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: |
          curl --fail --silent --show-error --output /dev/null -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=图书简报管道异常 $(date +%F)" \
            -d "desp=当日简报生成失败，今日微信无日报，请查看日志：https://github.com/18810926935lk-netizen/daily-book-brief/actions"
