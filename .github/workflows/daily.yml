name: daily-brief
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-now'
  schedule:
    # 三次冗余触发提前到北京时间零点后，为 GitHub schedule 可能出现的数小时延迟留出余量。
    # 后续触发若发现当天已发布，会由 preflight 自动跳过生成与通知。
    - cron: '15 16 * * *'   # 北京时间 00:15
    - cron: '45 16 * * *'   # 北京时间 00:45
    - cron: '15 17 * * *'   # 北京时间 01:15
  workflow_dispatch:
    inputs:
      send_notification:
        description: 'Send this run to WeChat (leave false for diagnostics)'
        type: boolean
        default: false

      cloud_probe:
        description: 'Public Telegram Web connectivity test only, no account access'
        type: boolean
        default: false

      telegram_web_probe:
        description: 'Two fresh cloud WebA login/download tests; no publication or notification'
        type: boolean
        default: false

      telegram_inventory:
        description: 'Inspect public channel attachment filenames only'
        type: boolean
        default: false

      telegram_only:
        description: 'Validate Telegram download/extraction only; no generation or notification'
        type: boolean
        default: false

      telegram_priority_only:
        description: 'Retry and diagnose only WSJ and NYT attachment downloads; no publication or notification'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  telegram-inventory:
    if: inputs.telegram_inventory == true
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - env:
          TELEGRAM_WEB_STATE: ${{ secrets.TELEGRAM_WEB_STATE }}
          TELEGRAM_INVENTORY_ONLY: 'true'
        run: python telegram_web_source.py

  telegram-web-probe:
    if: inputs.telegram_web_probe == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.56.0 PyMuPDF==1.28.2
      - run: python -m playwright install --with-deps chromium
      - name: Restore login and verify one PDF
        env:
          TELEGRAM_WEB_STATE: ${{ secrets.TELEGRAM_WEB_STATE }}
        run: python probe_telegram_web.py

  cloud-probe:
    if: inputs.cloud_probe == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python probe_telegram_cloud.py

  build:
    if: inputs.cloud_probe != true && inputs.telegram_web_probe != true && inputs.telegram_inventory != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: preflight
        id: preflight
        env:
          TZ: Asia/Shanghai
        run: |
          D=$(date +%F)
          if test -f "site/${D}.json"; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "site/${D}.json already exists; skip duplicate generation and notification"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.already_published != 'true'
        with:
          python-version: '3.11'

      - name: deps
        if: steps.preflight.outputs.already_published != 'true'
        run: pip install htmldocx requests beautifulsoup4==4.14.3 markdownify==1.2.2 feedparser==6.0.12

      - name: publication-tests
        if: steps.preflight.outputs.already_published != 'true'
        run: python -m unittest test_publication -v

      - name: telegram-deps
        if: steps.preflight.outputs.already_published != 'true' && (vars.TELEGRAM_ENABLED == 'true' || inputs.telegram_only == true || inputs.telegram_priority_only == true)
        continue-on-error: true
        run: |
          pip install -r requirements-telegram.txt playwright==1.56.0
          if [ "${{ vars.TELEGRAM_SOURCE_MODE }}" = web ]; then
            python -m playwright install --with-deps chromium
            sudo apt-get update -qq
            sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          fi

      - name: telegram-source
        id: telegram
        if: vars.TELEGRAM_ENABLED == 'true' || inputs.telegram_only == true || inputs.telegram_priority_only == true
        continue-on-error: true
        timeout-minutes: 25
        env:
          TELEGRAM_AUTH_JSON: ${{ secrets.TELEGRAM_AUTH_JSON }}
          TELEGRAM_WEB_STATE: ${{ secrets.TELEGRAM_WEB_STATE }}
          TELEGRAM_WORK_DIR: ${{ runner.temp }}/telegram-private
          TELEGRAM_PRIORITY_ONLY: ${{ inputs.telegram_priority_only }}
        run: |
          if [ "${{ vars.TELEGRAM_SOURCE_MODE }}" = web ]; then python telegram_web_source.py; else python telegram_source.py; fi

      - name: telegram-check
        if: steps.preflight.outputs.already_published != 'true' && (inputs.telegram_only == true || inputs.telegram_priority_only == true)
        env:
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED }}
          TELEGRAM_OUTCOME: ${{ steps.telegram.outcome }}
        run: test "$TELEGRAM_OUTCOME" = success

      - name: collect
        if: steps.preflight.outputs.already_published != 'true' && inputs.telegram_only != true && inputs.telegram_priority_only != true
        env:
          TZ: Asia/Shanghai
        run: |
          mkdir -p data site
          python collect_editorial.py
          python collect.py lithub > data/lithub.txt 2>/dev/null || echo COLLECT_LITHUB_FAILED > data/lithub.txt
          python collect.py podcasts "The Daily" "Crime Junkie" "The Rest Is History" "SmartLess" "The Mel Robbins Podcast" "Stuff You Should Know" > data/podcasts.txt 2>/dev/null || echo COLLECT_PODCASTS_FAILED > data/podcasts.txt
          python collect.py googlenews "\"Book Deals\" Publishers Weekly" > data/rights.txt 2>/dev/null || echo RIGHTS_FAILED > data/rights.txt
          python collect.py googlenews "publishing rights deal book auction" >> data/rights.txt 2>/dev/null || true
          echo "collected:"; wc -c data/*.txt

      - name: generate
        if: steps.preflight.outputs.already_published != 'true' && inputs.telegram_only != true && inputs.telegram_priority_only != true
        env:
          TELEGRAM_SOURCE: ${{ runner.temp }}/telegram-private/source.json
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_TOKEN: ${{ secrets.GLM_TOKEN }}
          TZ: Asia/Shanghai
        run: python gen_brief.py

      - name: docx
        if: steps.preflight.outputs.already_published != 'true' && inputs.telegram_only != true && inputs.telegram_priority_only != true
        run: |
          D=$(date +%F)
          python make_docx.py "site/${D}.html" "site/${D}.docx" || echo "WARN: docx failed, continue"
        env:
          TZ: Asia/Shanghai

      - name: publish
        if: steps.preflight.outputs.already_published != 'true' && inputs.telegram_only != true && inputs.telegram_priority_only != true
        run: |
          git config user.name "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add site/ data/telegram*json
          # Source excerpts remain private; commit only finished manuscripts and deduplication metadata.
          git commit -m "brief $(date +%F)" || echo "nothing to commit"
          git push
        env:
          TZ: Asia/Shanghai

      - name: notify
        if: steps.preflight.outputs.already_published != 'true' && inputs.telegram_only != true && inputs.telegram_priority_only != true && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.send_notification == true)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          TZ: Asia/Shanghai
        run: python notify.py

      # 任一步骤失败也要推送告警，避免无声断更（2026-09-19教训）
      - name: notify-failure
        if: failure() && steps.preflight.outputs.already_published != 'true' && inputs.telegram_only != true && inputs.telegram_priority_only != true && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.send_notification == true)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TZ: Asia/Shanghai
        run: |
          curl --fail --silent --show-error --output /dev/null -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=图书简报管道异常 $(date +%F)" \
            -d "desp=当日简报生成失败，今日微信无日报，请查看日志：https://github.com/18810926935lk-netizen/daily-book-brief/actions"
